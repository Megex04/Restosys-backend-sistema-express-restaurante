version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: secret_restosys
      POSTGRES_DB: restosys_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_panel
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@restsys.com
      PGADMIN_DEFAULT_PASSWORD: admin_restosys
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: